version: '3.8'

# ==============================================================================
# PULARI BAKES SELF-HOSTED STACK (POSTGRESQL 16 + POSTGREST + SWAGGER UI)
# Zero Vendor Lock-in drop-in replacement for Supabase
# Compatible with: Docker, Podman, VPS (Ubuntu/Debian), Kubernetes, Localhost
# ==============================================================================

services:
  # 1. PostgreSQL 16 Portable Relational Database
  pulari-postgres:
    image: postgres:16-alpine
    container_name: pulari-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulari_bakes_db}
      POSTGRES_USER: ${POSTGRES_USER:-pulari_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulari_secure_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pulari_postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_initial_schema.sql:ro
      - ./migrations/002_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      - ./migrations/003_special_mixtures.sql:/docker-entrypoint-initdb.d/03_special_mixtures.sql:ro
      - ./migrations/004_unit_conversions_and_audit.sql:/docker-entrypoint-initdb.d/04_unit_conversions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulari_admin} -d ${POSTGRES_DB:-pulari_bakes_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. PostgREST (Provides REST API matching Supabase REST endpoints)
  pulari-postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: pulari-postgrest
    restart: unless-stopped
    depends_on:
      pulari-postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-pulari_admin}:${POSTGRES_PASSWORD:-pulari_secure_pass_2026}@pulari-postgres:5432/${POSTGRES_DB:-pulari_bakes_db}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-pulari_admin}
      PGRST_OPENAPI_MODE: follow-privileges
      PGRST_SERVER_PORT: 3000
    ports:
      - "${POSTGREST_PORT:-3000}:3000"

  # 3. Swagger UI (Interactive API documentation and manual data testing)
  pulari-swagger:
    image: swaggerapi/swagger-ui:latest
    container_name: pulari-swagger
    restart: unless-stopped
    depends_on:
      - pulari-postgrest
    environment:
      API_URL: http://localhost:3000/
    ports:
      - "${SWAGGER_PORT:-8080}:8080"

volumes:
  pulari_postgres_data:
    driver: local
